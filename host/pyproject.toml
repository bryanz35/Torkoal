[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "robot-host"
version = "0.1.0.dev0"
description = "Raspberry Pi coordinator for the modular robot (docs/DESIGN.md §8)"
requires-python = ">=3.12,<3.13"
# Runtime stack from docs/DESIGN.md §2. PyYAML parses the runtime config of
# §8.3; see docs/adr/0001-toolchain-provisioning.md. Exact versions and hashes
# live in requirements.lock (regenerate with `make lock-python`).
dependencies = [
    "aiohttp>=3.12,<4",
    "pydantic>=2.11,<3",
    "pyserial-asyncio>=0.6,<0.7",
    "PyYAML>=6.0,<7",
]

[project.scripts]
robot-host = "robot_host.main:main"

[dependency-groups]
dev = [
    "clang-format",
    "hatchling",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/robot_host"]

[tool.hatch.build]
# Editable installs use a plain .pth entry, so no extra build dependency.
dev-mode-dirs = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "-p", "no:cacheprovider"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
xfail_strict = true
